# Run locally with uvx prek run --all-files. Renovate maintains hook pins.
repos:
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
  # Python linting and formatting; rules live in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly (strict, all platforms)
        entry: uv run --locked --only-group typing pyrefly check
        language: system
        pass_filenames: false
        always_run: true
  # GitHub Actions security audit. Config in .github/zizmor.yml; the gate is
  # --min-severity high (lower findings stay advisory).
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args:
          - --no-progress
          - --config
          - .github/zizmor.yml
          - --min-severity
          - high
          - .github/workflows/
  # Workflow syntax, expressions, job graph and inline shell (bundles
  # shellcheck via the wheel's own dependency).
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        additional_dependencies: [shellcheck-py]
