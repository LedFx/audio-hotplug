# Keep the filename stable for PyPI's trusted publisher configuration.
name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_only: ${{ steps.version_scope.outputs.version_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # version-scope diffs PRs against origin/main: merge refs carry no
          # parents without full history.
          fetch-depth: 0
      - id: version_scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          case "$EVENT" in
            pull_request) base="origin/main...HEAD" ;;
            push)
              if [[ "$REF" == refs/tags/* ]]; then exit 0; fi
              base="HEAD^"
              ;;
            *) exit 0 ;; # schedule and manual runs always build
          esac
          export SCOPE_BASE="$base"
          scope=$(python3 - <<'PY'
          import os, re, subprocess

          def git(*args: str) -> str:
              result = subprocess.run(
                  ["git", *args], capture_output=True, text=True, timeout=30
              )
              return result.stdout if result.returncode == 0 else ""

          files = set(git("diff", "--name-only", os.environ["SCOPE_BASE"], "HEAD").split())
          if not files:
              print("false")  # empty or unreadable diff: build everything
              raise SystemExit
          prose = {"CHANGELOG.md", ".release-please-manifest.json"}
          manifests = {"pyproject.toml", "uv.lock"}
          rest = files - manifests
          if rest and not rest <= prose:
              print("false")
              raise SystemExit
          anchors = ('name="audio-hotplug"', "[package]", "[project]")
          for name in sorted(files & manifests):
              patch = git("diff", "--unified=0", os.environ["SCOPE_BASE"], "HEAD", "--", name)
              if not patch:
                  print("false")
                  raise SystemExit
              for hunk in re.split(r"^@@", patch, flags=re.MULTILINE)[1:]:
                  lines = hunk.splitlines()
                  parts = lines[0].split(maxsplit=3)
                  anchor = parts[3].lstrip() if len(parts) > 3 else ""
                  changed = [
                      line[1:].lstrip()
                      for line in lines[1:]
                      if line[:1] in {"+", "-"}
                  ]
                  ok = bool(changed) and all(c.startswith("version") for c in changed)
                  ok = ok and anchor.replace(" ", "").startswith(anchors)
                  if not ok:
                      print("false")
                      raise SystemExit
          print("true")
          PY
          )
          echo "version_only=$scope" >> "$GITHUB_OUTPUT"
  lint:
    name: Lint (prek)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          enable-cache: false
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: '0.5.3'
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [lint, plan]
    if: needs.plan.outputs.version_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Test
        run: uv run --no-sync pytest -v --cov=audio_hotplug --cov-report=term
  build:
    needs: [lint, plan]
    if: needs.plan.outputs.version_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Check version and release tag
        env:
          REF: ${{ github.ref }}
        run: |
          uv run --no-project python - <<'PY'
          import ast, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          module = ast.parse(pathlib.Path('src/audio_hotplug/__init__.py').read_text())
          package_version = next(ast.literal_eval(n.value) for n in module.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          assert package_version == version, (package_version, version)
          ref = os.environ['REF']
          assert not ref.startswith('refs/tags/') or ref == f'refs/tags/v{version}', ref
          PY
      - run: uv build
      - run: uv run --locked --only-group build twine check dist/*
      - name: Smoke test wheel outside source tree
        run: |
          uv venv "$RUNNER_TEMP/wheel-test"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          wheel-test/bin/python -c 'import audio_hotplug; assert audio_hotplug.create_monitor() is not None'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
  ci-passed:
    name: CI passed
    needs: [plan, lint, test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Version-only release bumps legitimately skip test/build; lint always runs.
      - name: Require lint even for metadata-only changes
        if: needs.lint.result != 'success'
        run: exit 1
      - name: Require native coverage unless the diff is release metadata
        if: needs.plan.outputs.version_only != 'true'
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(v['result'] == 'success' for k, v in results.items() if k != 'plan'), results
          PY
  publish-release:
    name: Publish verified package release
    needs: [ci-passed]
    if: github.repository == 'LedFx/audio-hotplug' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.ci-passed.result == 'success'
    environment:
      name: pypi
      url: https://pypi.org/p/audio-hotplug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            pyproject.toml
          sparse-checkout-cone-mode: false
          path: release-tools
      - name: Mint scoped publication token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-attestations: write
      - name: Freeze verified distributions and release identity
        id: prepare
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: prepare
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/release-snapshot.json
      - name: Attest the tested distributions
        id: provenance
        if: steps.prepare.outputs.already_published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/dist/*
          create-storage-record: false
          github-token: ${{ steps.release-token.outputs.token }}
      - name: Recheck immutable inputs before PyPI upload
        id: upload
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: check-upload
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/release-snapshot.json
      - name: Stage verified distributions for PyPI
        if: steps.upload.outputs.pypi_upload == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir pypi-dist
          cp -- dist/* pypi-dist/
      - name: Publish matching missing Python distributions
        if: steps.upload.outputs.pypi_upload == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist/
          skip-existing: true # Both preflights require matching remote SHA-256.
      - name: Verify provenance and finalize existing GitHub draft
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: finalize
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/release-snapshot.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: release-provenance-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-snapshot.json
            ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
