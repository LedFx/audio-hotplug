name: PR title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions: {}
jobs:
  check:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PYTHON'
          import os, re, sys
          if not re.fullmatch(r"(?:feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\([^\r\n]+\))?!?: [^\r\n]+", os.environ["TITLE"]):
              print("::error::Use a Conventional Commit title, for example fix: handle audio device changes")
              sys.exit(1)
          PYTHON
