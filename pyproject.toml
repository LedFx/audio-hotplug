[project]
name = "audio-hotplug"
version = "0.2.1"
description = "Cross-platform audio device hotplug detection with debouncing"
readme = "README.md"
authors = [
    { name = "LedFx Developers", email = "developers@ledfx.app" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["audio", "device", "hotplug", "monitoring", "udev", "coreaudio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]

# Platform-specific dependencies using markers
dependencies = [
    "typing-extensions>=4.12.0",
    "pycaw>=20260927; platform_system=='Windows'",
    "comtypes>=1.4.8; platform_system=='Windows'",
    "pyobjc-framework-CoreAudio>=9.0; platform_system=='Darwin'",
    "pyudev>=0.24.0; platform_system=='Linux'",
]

[project.optional-dependencies]
# Explicit platform extras for manual installation
windows = ["pycaw>=20260927; platform_system=='Windows'", "comtypes>=1.4.8; platform_system=='Windows'"]
macos = ["pyobjc-framework-CoreAudio>=9.0; platform_system=='Darwin'"]
linux = ["pyudev>=0.24.0; platform_system=='Linux'"]

# Development tools are not published as installation extras.
[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "typing" },
    "ruff>=0.1.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
]
typing = ["pyrefly>=1.3.2,<2", "typing-extensions>=4.12.0"]

build = ["twine>=6.2.0"]

[project.urls]
Homepage = "https://github.com/LedFx/audio-hotplug"
Repository = "https://github.com/LedFx/audio-hotplug"
Issues = "https://github.com/LedFx/audio-hotplug/issues"
Documentation = "https://github.com/LedFx/audio-hotplug#readme"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["typings/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]  # Line length handled by Ruff formatting

[tool.ruff.lint.per-file-ignores]
# COM interface names and parameters must match the Windows API.
"src/audio_hotplug/_platform/windows.py" = ["N802", "N803"]
# Stubs preserve the upstream APIs' names.
"typings/**/*.pyi" = ["N802", "N803", "N815", "N816"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src/**/*.py", "typings/**/*.pyi"]
search-path = ["src", "typings"]
python-version = "3.10"
python-platform = "all"
infer-with-first-use = false

[tool.pyrefly.errors]
unannotated-return = "error"
explicit-any = "error"
no-any-return = "error"
untyped-function-decorator = "error"
