[project]
name = "audio-hotplug"
version = "0.1.0"
description = "Cross-platform audio device hotplug detection with debouncing"
readme = "README.md"
authors = [
    { name = "LedFx Developers", email = "developers@ledfx.app" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["audio", "device", "hotplug", "monitoring", "udev", "coreaudio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]

# Platform-specific dependencies using markers
dependencies = [
    "pycaw>=20220416; platform_system=='Windows'",
    "comtypes>=1.1.14; platform_system=='Windows'",
    "pyobjc-framework-CoreAudio>=9.0; platform_system=='Darwin'",
    "pyudev>=0.24.0; platform_system=='Linux'",
]

[project.optional-dependencies]
# Explicit platform extras for manual installation
windows = ["pycaw>=20220416", "comtypes>=1.1.14"]
macos = ["pyobjc-framework-CoreAudio>=9.0"]
linux = ["pyudev>=0.24.0"]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/LedFx/audio-hotplug"
Repository = "https://github.com/LedFx/audio-hotplug"
Issues = "https://github.com/LedFx/audio-hotplug/issues"
Documentation = "https://github.com/LedFx/audio-hotplug#readme"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]  # Line length handled by Ruff formatting

[tool.ruff.lint.per-file-ignores]
# COM interface names and parameters must match the Windows API.
"src/audio_hotplug/_platform/windows.py" = ["N802", "N803"]
